
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEase - Online Shopping</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f7fb;color:#17233a}
header{background:white;padding:20px 7%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;box-shadow:0 3px 15px #0001}
header h1{font-size:27px}
nav{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
nav a{text-decoration:none;color:#17233a;font-weight:bold}
button{cursor:pointer;border:0;border-radius:8px;padding:12px;font-weight:bold}
.cart-button{background:#ff784f;color:white}
.hero{background:linear-gradient(120deg,#17233a,#304d73);color:white;text-align:center;padding:75px 20px}
.hero h2{font-size:clamp(32px,5vw,52px);margin-bottom:12px}
.hero p{color:#e0e7f1}
.products{padding:55px 5%}
.products h2{text-align:center;font-size:32px;margin-bottom:25px}
#search{display:block;width:min(100%,500px);padding:15px;border:1px solid #ddd;border-radius:30px;margin:0 auto 25px;font-size:16px}
.categories{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:30px}
.categories button{background:white;border:1px solid #ddd}
.categories button:hover{background:#ff784f;color:white}
#product-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
.product-card{background:white;border-radius:15px;overflow:hidden;box-shadow:0 5px 20px #0001}
.product-card img{width:100%;height:210px;object-fit:cover;display:block}
.product-info{padding:17px}
.product-info h3{margin-bottom:12px}
.price{font-size:20px;color:#ff784f;font-weight:bold;margin-bottom:15px}
.details-btn{display:block!important;visibility:visible!important;opacity:1!important;width:100%;background:#ff784f!important;color:white!important;margin-bottom:9px}
.add-btn{display:block;width:100%;background:#17233a;color:white}
#cart-section,#checkout-section{background:white;margin-top:30px;padding:45px 7%}
#cart-section h2,#checkout-section h2{margin-bottom:20px}
.cart-row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:15px 0;border-bottom:1px solid #eee}
.cart-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cart-actions button{background:#17233a;color:white}
.remove-btn{background:#ffe7e1!important;color:#c43e25!important}
.total{font-size:24px;color:#ff784f;font-weight:bold;margin-top:20px}
.checkout-button{background:#ff784f;color:white;margin-top:15px}
#checkout-section{display:none}
#checkout-form{max-width:500px;display:flex;flex-direction:column;gap:13px}
#checkout-form input,#checkout-form textarea{padding:14px;border:1px solid #ddd;border-radius:8px;font:inherit}
#checkout-form button{background:#17233a;color:white}
#order-message{color:green;margin-top:15px;font-weight:bold}
footer{background:#17233a;color:white;text-align:center;padding:30px;margin-top:40px}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:1000;justify-content:center;align-items:center;padding:20px}
.modal-box{position:relative;background:white;border-radius:18px;overflow:auto;width:100%;max-width:750px;max-height:90vh;display:grid;grid-template-columns:1fr 1fr}
.modal-box img{width:100%;height:100%;min-height:300px;object-fit:cover}
.modal-info{padding:35px;display:flex;flex-direction:column;justify-content:center;gap:15px}
.modal-info h2{font-size:28px}
.modal-info p{line-height:1.6;color:#64748b}
.modal-info h3{color:#ff784f;font-size:25px}
.close-modal{position:absolute;right:12px;top:12px;background:#17233a;color:white;border-radius:50%;width:38px;height:38px;font-size:22px;padding:0;z-index:2}
.modal-add{background:#ff784f;color:white}
@media(max-width:900px){#product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){
 header{flex-direction:column;gap:15px}
 nav{justify-content:center}
 #product-grid{grid-template-columns:1fr}
 .modal-box{grid-template-columns:1fr}
 .modal-box img{height:220px;min-height:220px}
 .modal-info{padding:22px}
 .cart-row{align-items:flex-start;flex-direction:column}
}
</style>
</head>

<body>

<header>
<h1>ShopEase.</h1>
<nav>
<a href="#home">Home</a>
<a href="#products">Products</a>
<a href="#categories">Categories</a>
<button class="cart-button" onclick="showCart()">Cart (<span id="cart-count">0</span>)</button>
</nav>
</header>

<section class="hero" id="home">
<h2>Discover Your Style</h2>
<p>Find your favourite products at amazing prices.</p>
</section>

<section class="products" id="products">
<h2>Our Products</h2>
<input id="search" placeholder="Search products..." oninput="searchProducts()">

<div class="categories" id="categories">
<button onclick="filterCategory('All')">All</button>
<button onclick="filterCategory('Fashion')">Fashion</button>
<button onclick="filterCategory('Electronics')">Electronics</button>
<button onclick="filterCategory('Accessories')">Accessories</button>
</div>

<div id="product-grid"></div>
</section>

<section id="cart-section">
<h2>Your Shopping Cart</h2>
<div id="cart-items">Your cart is empty.</div>
<div class="total">Total: ₹<span id="cart-total">0</span></div>
<button class="checkout-button" onclick="showCheckout()">Proceed to Checkout</button>
</section>

<section id="checkout-section">
<h2>Checkout</h2>
<form id="checkout-form" onsubmit="placeOrder(event)">
<input id="customer-name" placeholder="Your Full Name" required>
<input id="customer-phone" type="tel" placeholder="10 Digit Mobile Number" pattern="[0-9]{10}" maxlength="10" required>
<textarea id="customer-address" placeholder="Your Full Address" required></textarea>
<button type="submit">Place Demo Order</button>
</form>
<p id="order-message"></p>
<button class="checkout-button" onclick="closeCheckout()">Back to Shopping</button>
</section>

<footer>
<h2>ShopEase.</h2>
<p>Your Style, Your Choice.</p>
<p>© 2026 ShopEase. All Rights Reserved.</p>
</footer>

<div class="modal" id="product-modal" onclick="if(event.target===this)closeDetails()">
<div class="modal-box" id="modal-content"></div>
</div>

<script>
const products=[
{id:1,name:"Classic T-Shirt",price:499,category:"Fashion",description:"Comfortable everyday T-shirt with a classic design.",image:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=600"},
{id:2,name:"Stylish Sneakers",price:1299,category:"Fashion",description:"Stylish sneakers for everyday comfort.",image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600"},
{id:3,name:"Smart Watch",price:1999,category:"Electronics",description:"Modern smartwatch for your everyday lifestyle.",image:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600"},
{id:4,name:"Headphones",price:999,category:"Electronics",description:"Enjoy your favourite audio with stylish headphones.",image:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600"},
{id:5,name:"Classic Sunglasses",price:599,category:"Accessories",description:"Classic sunglasses for everyday use.",image:"https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=600"},
{id:6,name:"Leather Watch",price:1499,category:"Accessories",description:"Classic watch design with a stylish strap.",image:"https://images.unsplash.com/photo-1524592094714-0f0654e20314?w=600"},
{id:7,name:"Casual Shoes",price:1099,category:"Fashion",description:"Versatile casual shoes for everyday wear.",image:"https://images.unsplash.com/photo-1549298916-b41d501d3772?w=600"},
{id:8,name:"Wireless Earbuds",price:799,category:"Electronics",description:"Compact wireless earbuds with a modern design.",image:"https://images.unsplash.com/photo-1606220945770-b5b6c2c55bf1?w=600"}
];

let cart=[];

function displayProducts(list=products){
const grid=document.getElementById("product-grid");
grid.innerHTML="";
list.forEach(p=>{
const card=document.createElement("div");
card.className="product-card";
card.innerHTML=`
<img src="${p.image}" alt="${p.name}">
<div class="product-info">
<h3>${p.name}</h3>
<div class="price">₹${p.price}</div>
<button type="button" class="details-btn" onclick="showDetails(${p.id})">View Details</button>
<button type="button" class="add-btn" onclick="addToCart(${p.id})">Add to Cart</button>
</div>`;
grid.appendChild(card);
});
}

function showDetails(id){
const p=products.find(item=>item.id===id);
if(!p)return;
document.getElementById("modal-content").innerHTML=`
<button class="close-modal" onclick="closeDetails()">×</button>
<img src="${p.image}" alt="${p.name}">
<div class="modal-info">
<p>${p.category}</p>
<h2>${p.name}</h2>
<p>${p.description}</p>
<h3>₹${p.price}</h3>
<button class="modal-add" onclick="addToCart(${p.id});closeDetails()">Add to Cart</button>
</div>`;
document.getElementById("product-modal").style.display="flex";
document.body.style.overflow="hidden";
}

function closeDetails(){
document.getElementById("product-modal").style.display="none";
document.body.style.overflow="";
}

function addToCart(id){
const p=products.find(item=>item.id===id);
const existing=cart.find(item=>item.id===id);
if(existing)existing.quantity++;
else cart.push({...p,quantity:1});
updateCart();
}

function changeQuantity(id,amount){
const item=cart.find(p=>p.id===id);
if(!item)return;
item.quantity+=amount;
if(item.quantity<=0)cart=cart.filter(p=>p.id!==id);
updateCart();
}

function removeFromCart(id){
cart=cart.filter(p=>p.id!==id);
updateCart();
}

function updateCart(){
let total=0,count=0;
const box=document.getElementById("cart-items");
box.innerHTML="";
if(cart.length===0)box.textContent="Your cart is empty.";
cart.forEach(item=>{
let subtotal=item.price*item.quantity;
total+=subtotal;
count+=item.quantity;
box.innerHTML+=`
<div class="cart-row">
<div><strong>${item.name}</strong><p>₹${item.price} × ${item.quantity} = ₹${subtotal}</p></div>
<div class="cart-actions">
<button onclick="changeQuantity(${item.id},-1)">−</button>
<span>${item.quantity}</span>
<button onclick="changeQuantity(${item.id},1)">+</button>
<button class="remove-btn" onclick="removeFromCart(${item.id})">Remove</button>
</div></div>`;
});
document.getElementById("cart-total").textContent=total;
document.getElementById("cart-count").textContent=count;
}

function filterCategory(category){
displayProducts(category==="All"?products:products.filter(p=>p.category===category));
}

function searchProducts(){
const value=document.getElementById("search").value.toLowerCase();
displayProducts(products.filter(p=>p.name.toLowerCase().includes(value)||p.category.toLowerCase().includes(value)));
}

function showCart(){
document.getElementById("cart-section").scrollIntoView({behavior:"smooth"});
}

function showCheckout(){
if(cart.length===0){alert("Please add a product first.");return;}
document.getElementById("checkout-section").style.display="block";
document.getElementById("checkout-section").scrollIntoView({behavior:"smooth"});
}

function closeCheckout(){
document.getElementById("checkout-section").style.display="none";
showCart();
}

function placeOrder(event){
event.preventDefault();
const name=document.getElementById("customer-name").value.trim();
const phone=document.getElementById("customer-phone").value.trim();
const address=document.getElementById("customer-address").value.trim();
if(!name||!(/^[0-9]{10}$/.test(phone))||!address){alert("Please enter valid details.");return;}
const total=cart.reduce((sum,item)=>sum+item.price*item.quantity,0);
document.getElementById("order-message").textContent=`Thank you ${name}! Your demo order of ₹${total} has been placed.`;
cart=[];
updateCart();
document.getElementById("checkout-form").reset();
document.getElementById("checkout-form").style.display="none";
}

displayProducts();
updateCart();
</script>

</body>
</html>
